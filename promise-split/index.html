summary{padding:12px 0;min-height:44px;cursor:pointer;font-size:14px}.payoff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.payoff div{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid #514274;border-radius:16px;padding:16px 6px;background:#241C42}.payoff b{font-size:27px}.payoff span{font-size:14px}.payoff strong{font-size:24px;color:#C6FF3D}.rule{padding:16px}.pick{flex:1;min-height:170px}.pk{min-width:0}.who .av{font-size:48px}.who .nm{font-size:24px}.who .tg{font-size:13px}.hint{font-size:15px;line-height:1.5}.coin{font-size:14px;gap:6px;flex-wrap:wrap}.reveal-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;flex:1}.reveal-pair div{display:flex;flex-direction:column;justify-content:center;align-items:center;background:#241C42;border-radius:20px;gap:12px;min-height:230px}.reveal-pair span{font-size:60px}.reveal-pair strong{font-size:44px;color:#C6FF3D}.result-card{border:2px solid #C6FF3D;background:radial-gradient(ellipse at top right,#433151,#1A1636 70%);padding:20px 16px}.identity{font-size:24px;font-weight:800;margin:8px 0}.result-title{font-size:clamp(40px,11vw,48px);font-weight:900;color:#C6FF3D;line-height:1.1;letter-spacing:-.045em;overflow-wrap:anywhere}.result-number{font-size:68px;font-weight:900;line-height:1.2}.result-number small{font-size:20px;margin-left:6px}.grid{font-size:24px;letter-spacing:0;overflow-wrap:anywhere}.hist{font-size:16px}.hist u{font-size:15px}.tom h2{font-size:17px}textarea{width:100%;min-height:180px;background:#241C42;color:white;font:inherit;padding:10px;border:1px solid #C6FF3D;border-radius:10px}

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div><noscript>JavaScript를 켜면 게임을 시작할 수 있어요.</noscript>
<script>
'use strict';
/* 적용 기준: game-dev/01077.md, 최신 보완 01091.md, QA/01078.md의 제안 상수.
   QA 기존 승률은 재현 증거가 없어 채택하지 않음. */
const CONFIG=Object.freeze({
 VERSION:'1.1', PAYOFF:{PP:[3,3],PB:[0,5],BP:[5,0],BB:[1,1]},
 ROUNDS_MIN:5,ROUNDS_MAX:7,PRACTICE_ROUNDS:5,
 // game-qa/01078.md 최종 조정값 4개 (기존 12·13·8·10)
 TARGET:Object.freeze({mija:13,junseok:14,dongwook:7,sunmi:11}),
 PROB:{mija:.9,dongwook:.7,sunmi:.5},
 DONGWOOK_COOP_AFTER:2,PRACTICE_SCRIPT:['P','P','P','B','P']
});
const CH=[
 {id:'mija',e:'🐰',name:'미자',c:'#FF8FB8',tag:'열 번 중 아홉 번은 약속'},
 {id:'junseok',e:'🦊',name:'준석',c:'#5CC8FF',tag:'네 직전 선택을 따라 해요'},
 {id:'dongwook',e:'😈',name:'동욱',c:'#FF797D',tag:'잘 배신해도, 두 번 당하면 순해져요'},
 {id:'sunmi',e:'🔮',name:'선미',c:'#BAA0FF',tag:'약속도 배신도 반반'}
];
const MV={P:'🤝',B:'😏'},LABEL={P:'약속',B:'배신'},KEY='promiseSplit.v1',URL_SHARE='https://leekyounglyul.github.io/gatsaeng/promise-split/';
const $=s=>document.querySelector(s),app=$('#app');
function day(now=new Date()){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);}
function previous(d){return new Date(Date.parse(d+'T00:00:00Z')-86400000).toISOString().slice(0,10);}
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(seed){let a=hash(seed);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function newMatch(id,practice=false,date=day()){
 const r=rng(date+'#'+id),rounds=practice?CONFIG.PRACTICE_ROUNDS:CONFIG.ROUNDS_MIN+Math.floor(r()*(CONFIG.ROUNDS_MAX-CONFIG.ROUNDS_MIN+1));
 return {id,practice,date,rounds,rolls:Array.from({length:8},()=>r()),hist:[],me:0,op:0,forgiven:false,t:0,done:false};
}
// 상대 행동은 나의 현재 선택을 전달받지 않는다. 공개된 과거만 사용한다.
function oppMove(m){
 if(m.practice)return CONFIG.PRACTICE_SCRIPT[m.t];
 if(m.id==='mija')return m.rolls[m.t]<CONFIG.PROB.mija?'P':'B';
 if(m.id==='sunmi')return m.rolls[m.t]<CONFIG.PROB.sunmi?'P':'B';
 if(m.id==='dongwook')return m.hist.filter(h=>h.me==='B').length>=CONFIG.DONGWOOK_COOP_AFTER?'P':m.rolls[m.t]<CONFIG.PROB.dongwook?'B':'P';
 if(!m.t)return 'P';
 const last=m.hist[m.t-1].me;
 if(last==='B'&&!m.forgiven){m.forgiven=true;return 'P';}
 return last;
}
function step(m,me){
 if(m.done||!['P','B'].includes(me))return false;
 const op=oppMove(m),pay=CONFIG.PAYOFF[me+op];
 m.me+=pay[0];m.op+=pay[1];m.hist.push({me,op});m.t++;m.done=m.t===m.rounds;return true;
}
function validMatch(m){
 try{if(!m||!CH.some(c=>c.id===m.id)||typeof m.practice!=='boolean'||!validDay(m.date)||!Array.isArray(m.hist)||m.hist.length>7)return false;
 const r=newMatch(m.id,m.practice,m.date);for(const h of m.hist){if(!step(r,h.me)||r.hist.at(-1).op!==h.op)return false;}
 return ['id','practice','date','rounds','rolls','hist','me','op','forgiven','t','done'].every(k=>JSON.stringify(m[k])===JSON.stringify(r[k]));
 }catch{return false;}
}
function validDay(d){return typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d;}
const blank=()=>({version:CONFIG.VERSION,streak:0,last:'',wins:{},tut:false,day:day(),res:{},active:null});
let memory=null,storageFailed=false,rev=null,locked=false,M=null,installEvent=null;
function getRaw(){if(storageFailed)return memory;try{return localStorage.getItem(KEY)}catch{storageFailed=true;return memory}}
function load(){
 const raw=getRaw();rev=raw;
 try{const s=JSON.parse(raw);if(!s||s.version!==CONFIG.VERSION)return blank();
 if(!validDay(s.day)||!Number.isSafeInteger(s.streak)||s.streak<0||!s.res||typeof s.res!=='object'||Array.isArray(s.res)||!s.wins||typeof s.wins!=='object')return blank();
 for(const [id,r] of Object.entries(s.res)){if(!validMatch(r)||r.practice||!r.done||r.id!==id||r.date!==s.day)return blank();}
 if(s.active&&(!validMatch(s.active)||s.active.practice||s.active.done||s.active.date!==s.day||s.res[s.active.id]))return blank();
 if(s.last&&!validDay(s.last))return blank();
 for(const [k,v] of Object.entries(s.wins))if(!CH.some(c=>c.id===k)||!Number.isSafeInteger(v)||v<0)return blank();
 return s;
 }catch{return blank();}
}
let S=load();
function save(){
 if(demo)return true;
 if(getRaw()!==rev){locked=true;app.innerHTML='<div class="card"><h1>다른 탭에서<br>기록이 바뀌었어요</h1><p class="def">이 탭의 저장을 멈췄어요. 다시 불러와 이어가세요.</p><button class="btn" onclick="location.reload()">다시 불러오기</button></div>';return false;}
 const raw=JSON.stringify(S);memory=raw;
 try{localStorage.setItem(KEY,raw)}catch{storageFailed=true;}
 rev=raw;return true;
}
function syncDay(){if(S.day!==day()){S.day=day();S.res={};S.active=null;}}
function streak(){return S.last===day()||S.last===previous(day())?S.streak:0;}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),2500)}
function foot(){return `<footer class="foot"><p>게임 속 코인 · 실제 돈·보상 없음 · 광고 0개</p><p>기록은 이 기기에만 저장${storageFailed?' · 저장 불가: 창을 닫으면 사라질 수 있어요':''}${demo?' · 검수 예시: 저장하지 않음':''}</p><p><a href="../">갓생 도구함 ↗</a> · <a href="mailto:atomo_studio@naver.com">문의</a> · <button class="text-btn" onclick="install()">홈 화면 추가</button></p><p>규칙 봇 대전 · 글꼴 jsDelivr CDN · 갓생 연구소 by Atomo Studio</p></footer>`;}
function top(back=false){return `<div class="top">${back?'<button class="text-btn" onclick="home()">← 처음으로</button>':'<span>🤝 약속의 분배</span>'}<span class="chip fire">🔥 ${streak()}일째</span></div>`;}
function payoff(){return `<div class="payoff" aria-label="나의 선택과 상대 선택에 따른 코인"><div><b>🤝 + 🤝</b><span>나 <strong>3</strong> · 상대 3</span></div><div><b>🤝 + 😏</b><span>나 <strong>0</strong> · 상대 5</span></div><div><b>😏 + 🤝</b><span>나 <strong>5</strong> · 상대 0</span></div><div><b>😏 + 😏</b><span>나 <strong>1</strong> · 상대 1</span></div></div>`;}
function home(){
 if(locked)return;M=null;syncDay();const n=Object.keys(S.res).length;
 app.innerHTML=top()+`<h1>약속할까,<br><b>배신</b>할까?<em>4명과 1:1</em></h1><p class="def">약속·배신을 동시에 골라 코인 모으기.<br><strong>각 상대의 목표 코인 이상이면 승리!</strong></p><div class="stamps">${CH.map(c=>{const r=S.res[c.id];return `<button class="st ${r?(r.me>=CONFIG.TARGET[c.id]?'win':'lose'):''}" style="--c:${c.c}" onclick="start('${c.id}')"><span class="e">${c.e}</span><span class="n">${c.name}</span><span class="tag">${c.tag}</span><span class="s">${r?`🪙${r.me} · ${r.me>=CONFIG.TARGET[c.id]?'도장 획득 ✓':'완료'}`:`목표 🪙${CONFIG.TARGET[c.id]}`}</span></button>`}).join('')}</div>
 <button class="btn" onclick="${S.active?'resume()':S.tut?`start('${CH.find(c=>!S.res[c.id])?.id||'mija'}')`:'rules()'}">${S.active?'이어 하기 →':S.tut?'오늘의 상대 만나기 →':'그림 규칙 → 손잡고 연습'}</button><p class="micro">${S.day} · 완료 ${n}/4 · 무료 · 가입 없음</p>
 ${n?'<button class="btn pink" onclick="share()">내 점수·약속 성향 비교하기</button>':''}
 <details><summary>규칙·캐릭터 공략 한눈에 보기</summary><div class="card">${payoff()}<p class="def">5~7번째 중 언젠가 끝나요. 상대보다 높아도 목표 미달이면 실패! 목표와 같아도 성공이에요.</p><p class="def">준석은 첫 배신을 한 번 용서하고, 그다음부터 직전 선택을 따라 해요. 동욱은 내 누적 배신 2회 뒤 계속 약속해요.</p><button class="btn sub" onclick="rules()">그림 규칙·연습 다시 하기</button></div></details>
 <div class="card tom"><h2>🌙 내일, 같은 친구 다른 판</h2><p class="def">서울 00:00에 새 차례 수와 선택이 열려요.<br>하루 1명만 완료해도 연속 기록이 이어져요.</p><span id="countdown" class="micro"></span></div>${foot()}`;tick();
}
function rules(id='mija'){
 pendingId=id;app.innerHTML=top(true)+`<p class="eyebrow">30초면 시작 · 01 그림 규칙</p><h1>같이 믿으면 <em>각 3코인.</em></h1><p class="def">왼쪽이 나, 오른쪽이 상대예요.<br>서로의 이번 선택을 보기 전에 골라요.</p>${payoff()}<div class="card rule"><span class="no">✓</span><p><b>미자 목표는 ${CONFIG.TARGET.mija}코인.</b><br>목표 이상 모으면 승리!<br>실전은 5~7번째 중 끝나요.</p></div><button class="btn" onclick="practice()">🐰 미자와 손잡고 연습 5번 →</button><p class="micro">연습은 오늘 도장·연속 기록에 영향 없어요.</p>${foot()}`;
}
let pendingId='mija',lastReveal=false;
function practice(){M=newMatch('mija',true);lastReveal=false;play();}
function start(id){if(locked||!CH.some(c=>c.id===id))return;syncDay();if(!S.tut){rules(id);return;}if(S.res[id]){result(id);return;}if(S.active){resume();return;}M=newMatch(id);S.active=M;if(!save())return;lastReveal=false;play();}
function resume(){M=S.active;if(!M){home();return;}lastReveal=false;play();}
const HINTS=['🤝 약속을 눌러요. 미자도 약속 → 나 3, 미자 3.','다시 🤝. 서로 믿으면 3개씩 더 모아요.','이번엔 😏를 골라도 돼요. 미자가 약속하면 나 5, 미자 0.','이번 미자는 배신! 😏를 골라 서로 배신하면 각 1.','마지막은 다시 🤝. 실전은 끝나는 차례를 미리 몰라요.'];
function play(){
 const c=CH.find(c=>c.id===M.id),T=CONFIG.TARGET[c.id],h=M.hist.at(-1);
 app.innerHTML=top(true)+`<div class="who" style="--c:${c.c}"><div class="av">${c.e}</div><div><p class="eyebrow">${M.practice?'02 손잡고 연습 '+(M.t+1)+'/5':(M.t+1)+'번째 선택 · 실전'}</p><div class="nm">${c.name}</div><div class="tg">${c.tag}</div></div></div><div class="card"><div class="coin"><span>나 🪙${M.me} / 목표 ${T}</span><span>${c.name} 🪙${M.op}</span></div><div class="bar"><i style="width:${Math.min(100,M.me/T*100)}%"></i></div><p class="micro">${M.practice?'연습은 5번 고정':'5~7번째 중 언젠가 종료 · 목표 달성은 종료 때 판정'}</p></div>
 ${M.practice?`<div class="hint">💡 ${HINTS[M.t]}</div>`:'<div class="bub">이번엔 믿어 볼까?<br>내 선택은 상대에게 아직 안 보여요.</div>'}
 <div class="pick"><button class="pk p" onclick="choose('P')"><span>🤝</span>약속<small>같이 받자</small></button><button class="pk b" onclick="choose('B')"><span>😏</span>배신<small>나 먼저 받자</small></button></div><div class="hist">${M.hist.map(x=>`<u aria-label="나 ${LABEL[x.me]}, 상대 ${LABEL[x.op]}">${MV[x.me]}${MV[x.op]}</u>`).join('')||'<span class="micro">두 버튼 중 하나를 눌러요. 시간제한 없어요.</span>'}</div>${foot()}`;
}
function choose(me){if(locked||lastReveal||!M||M.done)return;if(!step(M,me))return;
 if(!M.practice){if(M.done){complete();return;}S.active=M;if(!save())return;}
 lastReveal=true;const h=M.hist.at(-1),pay=CONFIG.PAYOFF[h.me+h.op];app.innerHTML=top(true)+`<p class="eyebrow">${M.practice?'연습':'실전'} · ${M.t}번째 결과</p><h1>${h.me===h.op?'같은 선택!':'엇갈린 마음.'}</h1><div class="reveal-pair"><div><span>${MV[h.me]}</span><b>나 · ${LABEL[h.me]}</b><strong>+${pay[0]}</strong></div><div><span>${MV[h.op]}</span><b>상대 · ${LABEL[h.op]}</b><strong>+${pay[1]}</strong></div></div><div class="card"><p class="def">나는 ${M.me}코인 / 목표 ${CONFIG.TARGET[M.id]}<br>상대는 ${M.op}코인.<br>${M.practice?'두 선택의 조합으로 나눠 갖는 거예요.':'다음 선택은 상대의 성격을 떠올려 보세요.'}</p></div><button class="btn" onclick="continueMatch()">${M.done?'연습 결과 보기':'다음 선택 →'}</button>${foot()}`;
}
function continueMatch(){if(!M||!lastReveal)return;lastReveal=false;if(M.done){S.tut=true;save();practiceResult();}else play();}
function practiceResult(){app.innerHTML=top()+`<p class="eyebrow">연습 완료 · 기록에 포함 안 됨</p><h1>이제 감 잡았죠?<em>나 🪙${M.me}</em></h1><div class="card"><p class="def">미자의 실전 목표는 ${CONFIG.TARGET.mija}코인.<br>실전은 5~7번째 중 끝나요.<br>네 명 모두 약속 성향이 달라요.</p></div><button class="btn" onclick="start('${pendingId}')">오늘의 상대에게 도전 →</button><button class="btn sub" onclick="home()">4명 성격 다시 보기</button>${foot()}`;}
function complete(){if(!M||M.practice||!M.done||S.res[M.id])return;
 if(M.date!==day()){toast('지난 날짜의 판을 완료했어요. 오늘 연속 기록에는 포함하지 않아요.');syncDay();save();home();return;}
 S.res[M.id]=structuredClone(M);S.active=null;if(M.me>=CONFIG.TARGET[M.id])S.wins[M.id]=(S.wins[M.id]||0)+1;
 if(S.last!==M.date){S.streak=S.last===previous(M.date)?S.streak+1:1;S.last=M.date;}
 if(!save())return;result(M.id);
}
function titleFor(r){const p=r.hist.filter(h=>h.me==='P').length,n=r.hist.length,win=r.me>=CONFIG.TARGET[r.id];
 if(p===n)return '흔들림 없는 약속왕';if(p===0)return '일관된 반전주의자';
 if(p===n-1)return '딱 한 번의 반란';if(p===1)return '귀한 약속 한 번';
 if(r.hist.every((h,i)=>!i||h.me!==r.hist[i-1].me))return '밀당의 설계자';
 if(r.hist.slice(-2).every(h=>h.me==='P'))return '마지막엔 손잡는 사람';
 return win?'목표를 읽는 전략가':'내일 반전의 주인공';
}
function result(id){const r=S.res[id];if(!r)return home();const c=CH.find(c=>c.id===id),kept=r.hist.filter(h=>h.me==='P').length,win=r.me>=CONFIG.TARGET[id],next=CH.find(c=>!S.res[c.id]);
 app.innerHTML=top()+`<section class="card result-card"><p class="eyebrow">${r.date} · ${c.e} ${c.name}와 1:1</p><p class="identity">약속 ${kept}/${r.rounds} 지킴</p><h2 class="result-title">${titleFor(r)}</h2><div class="result-number">${r.me}<small>코인</small></div><p class="def">목표 ${CONFIG.TARGET[id]} · ${win?'도장 획득 ✓':'내일 재도전'} · 상대 ${r.op}</p><div class="grid">${r.hist.map(h=>MV[h.me]).join('')}</div><p class="micro">🤝 약속 선택 / 😏 배신 선택 · 성격 진단이 아닌 게임 결과예요.</p></section><button class="btn pink" onclick="share()">결과 공유 · 친구는 몇 코인?</button><button class="btn sub" onclick="sharePreview('${id}')">공유 카드 크게 보기</button><button class="text-btn" onclick="share(true)">텍스트 복사</button><textarea id="share-fallback" aria-label="길게 눌러 복사할 결과" hidden readonly></textarea>
 ${next?`<button class="btn" onclick="start('${next.id}')">다음 상대 ${next.e} ${next.name} →</button>`:'<p class="def">오늘 4명 완료! 내일 새 판에서 다시 만나요.</p>'}<div class="card tom"><h2>🌙 내일도 이 약속, 지킬 수 있을까?</h2><p class="def">서울 00:00에 새 판 · 연속 ${streak()}일째<br>친구와 같은 날짜·같은 상대끼리 비교해요.</p><span id="countdown" class="micro"></span></div><button class="text-btn" onclick="home()">처음으로 · 오늘 4명 결과 보기</button>${foot()}`;tick();
}
function sharePreview(id){
 result(id);const card=app.querySelector('.result-card').outerHTML;
 app.innerHTML=top()+`<p class="eyebrow">친구와 같은 날짜·같은 상대끼리 비교해요</p>${card}<p class="def">같은 판에서, 너는 몇 코인?</p><button class="btn pink" onclick="share()">결과 보내기</button><button class="btn sub" onclick="result('${id}')">결과로 돌아가기</button>${foot()}`;
}
function shareText(){const list=CH.filter(c=>S.res[c.id]).map(c=>{const r=S.res[c.id],p=r.hist.filter(h=>h.me==='P').length;return `${c.e} ${c.name} ${r.me}코인 / 목표 ${CONFIG.TARGET[c.id]} · 약속 ${p}/${r.rounds}\n칭호: ${titleFor(r)}\n${r.hist.map(h=>MV[h.me]).join('')}`});return `약속의 분배 ${S.day} · 규칙 ${CONFIG.VERSION}\n${list.join('\n')}\n🔥연속 ${streak()}일째 · 🤝약속 / 😏배신\n같은 날짜·상대에서 너는 몇 코인?\n${URL_SHARE}`;}
async function share(copyOnly=false){const text=shareText();if(!copyOnly&&navigator.share){try{await navigator.share({text});return}catch(e){if(e.name==='AbortError')return;}}
 try{await navigator.clipboard.writeText(text);toast('결과를 복사했어요. 친구에게 붙여넣어 보세요.')}catch{let el=$('#share-fallback');if(!el){el=document.createElement('textarea');el.id='share-fallback';el.setAttribute('aria-label','길게 눌러 복사할 결과');app.append(el);}el.hidden=false;el.value=text;el.focus();el.select();toast('텍스트를 길게 눌러 복사하세요.');}}
let timer;function tick(){clearInterval(timer);function update(){const el=$('#countdown');if(!el)return;const now=new Date(),date=day(now),end=Date.parse(date+'T00:00:00+09:00')+86400000,sec=Math.max(0,Math.floor((end-now)/1000));el.textContent='다음 판까지 '+[Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(n=>String(n).padStart(2,'0')).join(':');if(S.day!==date&&!M)home();}update();timer=setInterval(update,1000);}
window.addEventListener('storage',e=>{if(!demo&&e.key===KEY&&e.newValue!==rev){locked=true;app.innerHTML='<h1>다른 탭에<br>새 기록이 있어요</h1><button class="btn" onclick="location.reload()">다시 불러오기</button>';}});
window.addEventListener('focus',()=>{if(!M&&!locked&&S.day!==day())home();});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;});
async function install(){if(installEvent){await installEvent.prompt();installEvent=null;}else toast('Safari 공유 / Chrome 메뉴 → 홈 화면에 추가');}
const demo=new URLSearchParams(location.search).get('demo');
if(demo){S=blank();S.tut=true;if(demo==='play'){M=newMatch('mija');play();}else if(demo==='practice'){practice();}else if(demo==='result'||demo==='share'){const r=newMatch('mija');while(!r.done)step(r,r.t%3===2?'B':'P');S.res.mija=r;if(demo==='share')sharePreview('mija');else result('mija');}else home();}else home();
if(!demo&&'serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script>
</body></html>
