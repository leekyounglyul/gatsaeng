&lt;aside&gt;&lt;div id=&quot;result&quot; class=&quot;result&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;&lt;div class=&quot;receipt-title&quot;&gt;&lt;span&gt;MY WEEKLY PAY / 예상액&lt;/span&gt;&lt;span&gt;입력 기준&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;eyebrow&quot;&gt;02 / 예상 결과&lt;/p&gt;&lt;h2 id=&quot;status&quot; tabindex=&quot;-1&quot;&gt;조건을 확인해 주세요&lt;/h2&gt;&lt;p class=&quot;amount&quot; id=&quot;holiday&quot;&gt;—&lt;/p&gt;&lt;div id=&quot;example-preview&quot; class=&quot;hero-example&quot;&gt;&lt;span&gt;예시 미리보기 · 개인 계산 결과가 아닙니다&lt;/span&gt;&lt;strong&gt;41,280&lt;span&gt;원&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;시급 10,320원 · 매주 20시간 · 개근&lt;br&gt;통상 주 5일·40시간 기준&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;receipt-tag&quot;&gt;급여명세서와 나란히 놓아보세요&lt;/p&gt;&lt;p id=&quot;reason&quot;&gt;개근 여부와 계산 범위를 선택하면 예상 금액을 확인할 수 있어요.&lt;/p&gt;&lt;div id=&quot;numbers&quot; hidden&gt;&lt;dl class=&quot;rows&quot;&gt;&lt;div&gt;&lt;dt&gt;유급 주휴시간&lt;/dt&gt;&lt;dd id=&quot;holidayHours&quot;&gt;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;소정시간 기준 기본 주급&lt;/dt&gt;&lt;dd id=&quot;base&quot;&gt;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;주휴 포함 예상 주급&lt;/dt&gt;&lt;dd id=&quot;total&quot;&gt;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;주휴 제외 월 환산&lt;/dt&gt;&lt;dd id=&quot;monthlyBase&quot;&gt;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;주휴 포함 월 환산&lt;/dt&gt;&lt;dd id=&quot;monthly&quot;&gt;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;월 환산 기준&lt;/dt&gt;&lt;dd id=&quot;monthBasis&quot;&gt;&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;p class=&quot;small&quot;&gt;세전 · 연장·야간·휴일 가산 및 공제 제외&lt;br&gt;중간 반올림 없이 계산, 각 금액은 원 단위 반올림&lt;/p&gt;&lt;details&gt;&lt;summary&gt;내 입력으로 계산한 산식&lt;/summary&gt;&lt;p id=&quot;formula&quot; class=&quot;small&quot;&gt;&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;p class=&quot;small&quot; style=&quot;margin-top:18px&quot;&gt;주휴수당 = 시급 × (주 소정시간 ÷ 40 × 8)&lt;br&gt;통상 주 5일·40시간, 평균 주 15시간 이상·개근 기준&lt;/p&gt;&lt;p class=&quot;receipt-bottom&quot;&gt;급여 들어온 날, 이 예상액과 비교해요.&lt;br&gt;갓생 연구소 · by Atomo Studio&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;save-card&quot;&gt;급여일에 볼 결과 이미지 저장 ↓&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;small&quot; style=&quot;margin-top:8px&quot;&gt;시급·근무시간·개근·범위 선택값이 이미지에 포함됩니다.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;copy&quot;&gt;결과 복사&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;share&quot; class=&quot;secondary&quot;&gt;결과 공유&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;link&quot; class=&quot;secondary&quot;&gt;도구 링크만 복사&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;notice&quot; class=&quot;small&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;div id=&quot;manual&quot; hidden&gt;&lt;label for=&quot;copytext&quot;&gt;직접 복사할 내용&lt;/label&gt;&lt;textarea id=&quot;copytext&quot; rows=&quot;8&quot; readonly&gt;&lt;/textarea&gt;&lt;p class=&quot;small&quot;&gt;위 글을 길게 누르거나 Ctrl/Cmd+C로 복사하세요.&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;small&quot; style=&quot;margin-top:16px&quot;&gt;입력은 저장·전송하지 않습니다. 결과 공유에는 입력값이 텍스트로 포함되며, 링크에는 포함되지 않습니다.&lt;/p&gt;&lt;/aside&gt;&lt;/div&gt;
&lt;section class=&quot;guide&quot;&gt;&lt;h2&gt;내 근무시간, 한눈에 비교&lt;/h2&gt;&lt;p&gt;2026년 최저시급 10,320원 · 매주 같은 일정·개근·통상 주 5일 40시간 기준. 위 직접 입력 시급과 별개인 참고표입니다.&lt;/p&gt;&lt;table class=&quot;pay-table&quot; style=&quot;width:100%;border-collapse:collapse&quot;&gt;&lt;caption&gt;주 15·20·30·40시간 주휴수당 환산표 (세전)&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;주 시간&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;주휴시간&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;주휴수당&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;포함 주급&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;yearComparison&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;small&quot;&gt;급여일에 다시 보려면 이 표를 저장해 두세요. 내 조건을 입력한 결과는 위의 이미지 저장·복사 버튼으로 보관할 수 있어요.&lt;/p&gt;&lt;div class=&quot;tip&quot;&gt;&lt;strong&gt;월급은 주급과 구분해요&lt;/strong&gt;&lt;p&gt;주 40시간은 고시의 월 209시간으로 환산합니다. 그 밖에는 (소정시간 + 주휴시간) × 365 ÷ 7 ÷ 12로 환산합니다. 월 환산은 실제 지급액의 확정값이 아닙니다.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;guide&quot;&gt;&lt;h2&gt;급여일에 확인할 3가지&lt;/h2&gt;&lt;p&gt;① 계약서의 시급·소정시간 → ② 평균 주 15시간·개근 → ③ 예상액과 명세서 비교&lt;/p&gt;&lt;details&gt;&lt;summary&gt;입력 방법과 예외 자세히 보기&lt;/summary&gt;&lt;div class=&quot;steps&quot;&gt;&lt;article class=&quot;step&quot;&gt;&lt;p class=&quot;no&quot;&gt;01&lt;/p&gt;&lt;h3&gt;약속한 시간 확인&lt;/h3&gt;&lt;p&gt;근로계약서의 시급과 소정근로시간을 확인하세요. 30분은 0.5시간으로 입력합니다.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;step&quot;&gt;&lt;p class=&quot;no&quot;&gt;02&lt;/p&gt;&lt;h3&gt;평균·개근 확인&lt;/h3&gt;&lt;p&gt;평균 주 15시간 이상인지, 정해진 근로일에 모두 출근했는지 확인하세요.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;step&quot;&gt;&lt;p class=&quot;no&quot;&gt;03&lt;/p&gt;&lt;h3&gt;매주 다시 비교&lt;/h3&gt;&lt;p&gt;예상액과 급여명세서를 비교하세요. 이 페이지를 북마크하면 급여 확인일에 다시 쓰기 편합니다.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;tip&quot;&gt;&lt;strong&gt;팁 · 표준 사례로 먼저 확인하세요&lt;/strong&gt;&lt;p&gt;시급 10,320원, 매주 20시간, 개근이면 주휴시간 4시간, 주휴수당 41,280원, 주휴 포함 주급 247,680원입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;warning&quot;&gt;&lt;strong&gt;주의 · 예상액과 실제 지급액은 다를 수 있어요&lt;/strong&gt;&lt;p&gt;결근이면 이 도구는 주휴수당만 0원으로 안내합니다. 실제 일한 시간을 받지 않으므로 결근 주의 주급은 계산하지 않습니다. 출근으로 인정되는 휴가 등 개근 판단이 애매하면 ‘모름’을 선택하세요. 계약·취업규칙에 따른 추가 지급이나 예외는 고용노동부 1350에 확인하세요.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;
&lt;section class=&quot;guide&quot;&gt;&lt;h2&gt;계산 기준과 자주 묻는 질문&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;평균 14.99시간과 15시간은 어떻게 다른가요?&lt;/summary&gt;&lt;p&gt;4주 평균 주 소정근로시간이 15시간 미만이면 법정 주휴 적용 대상에서 제외됩니다. 15시간은 포함되며 개근 등 다른 조건도 확인해야 합니다. 평균은 경계 판단 전에 반올림하지 않습니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;주휴시간은 어떻게 구하나요?&lt;/summary&gt;&lt;p&gt;고정 일정·통상 주 5일 40시간 기준에서는 주 소정근로시간 ÷ 40 × 8입니다. 주휴수당은 그 시간 × 시급, 기본 주급은 소정근로시간 × 시급입니다. 일정이 달라 평균과 이번 주 시간이 다르면 이 도구는 단순 산식을 적용하지 않습니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;다음 주에도 일해야 하나요?&lt;/summary&gt;&lt;p&gt;다음 주 근무를 일률적인 필수 조건으로 추가하지 않습니다. 다만 퇴사 주의 근로관계·주휴일 판단은 별도 확인이 필요하므로 이 도구의 지원 범위에서 제외합니다.&lt;/p&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;이번 주 결근했으면 어떻게 되나요?&lt;/summary&gt;&lt;p&gt;약속한 근로일을 개근하지 않았다면 이 도구는 주휴수당을 0원으로 표시합니다. 지각·조퇴와 결근은 구분해야 하며, 출근으로 인정되는 휴가 등 판단이 애매하면 ‘모름’을 선택하고 확인하세요.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;직원 5명 미만인 가게도 받을 수 있나요?&lt;/summary&gt;&lt;p&gt;5인 미만 사업장이라는 이유만으로 주휴수당 적용에서 제외되지 않습니다. 평균 주 15시간·개근 등 근로조건을 확인하세요.&lt;/p&gt;&lt;/details&gt;
&lt;p class=&quot;small&quot; style=&quot;margin-top:24px&quot;&gt;&lt;strong&gt;적용: 2026년 · 공식 자료 확인일: 2026-10-20&lt;/strong&gt;&lt;br&gt;2026년 최저임금 시간급 10,320원 · 월 2,156,880원(209시간), 고용노동부고시 제2025-47호.&lt;br&gt;2027년 최저임금: 이번 검증에서 공식 금액 확인 불가. 이 계산기는 2026년만 적용합니다.&lt;/p&gt;&lt;ul class=&quot;small&quot;&gt;&lt;li&gt;&lt;a href=&quot;https://www.minimumwage.go.kr/customer/notice/view.do?bultnId=4657&quot;&gt;최저임금위원회: 2026년 적용 최저임금 고시(제2025-47호)&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;https://www.law.go.kr/법령/근로기준법/제18조&quot;&gt;근로기준법 제18조: 4주 평균 주 15시간 기준&lt;/a&gt; · &lt;a href=&quot;https://www.law.go.kr/법령/근로기준법/제55조&quot;&gt;제55조: 유급휴일&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;https://www.law.go.kr/법령/근로기준법시행령/제30조&quot;&gt;시행령 제30조: 개근&lt;/a&gt; · &lt;a href=&quot;https://www.law.go.kr/법령/근로기준법시행령/제9조&quot;&gt;제9조·별표2: 단시간근로자 기준&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;https://1350.moel.go.kr/rtmview.do?id=1000324737&quot;&gt;고용노동부 상담: 통상근로자 근로일수에 따른 산정례&lt;/a&gt; · &lt;a href=&quot;https://1350.moel.go.kr/rtmview.do?id=1000305360&quot;&gt;평균 15시간 미만 적용 안내&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
&lt;footer&gt;&lt;strong&gt;급여 확인 끝, 다음 일정도 가볍게&lt;/strong&gt;&lt;p&gt;달력에 급여일과 할 일을 함께 적어보세요. &lt;a href=&quot;https://lyulist.gumroad.com/l/2027-planner-free&quot;&gt;2027 플래너 무료 맛보기 ↗&lt;/a&gt; · 자사 상품 안내&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://leekyounglyul.github.io/gatsaeng/2027-leave/&quot;&gt;2027 연차 계산기 ↗&lt;/a&gt; · &lt;a href=&quot;../year-end-tax-calculator/&quot;&gt;연말정산 계산기 ↗&lt;/a&gt; · &lt;a href=&quot;https://atomostudio.blogspot.com/search?q=주휴수당&quot;&gt;블로그에서 주휴수당 사용법 읽기 ↗&lt;/a&gt; · &lt;a href=&quot;https://leekyounglyul.github.io/gatsaeng/&quot;&gt;갓생 도구함 ↗&lt;/a&gt;&lt;/p&gt;&lt;p style=&quot;margin-top:16px&quot;&gt;갓생 연구소 · by Atomo Studio&lt;br&gt;무료 · 무광고 · 계정 없이 사용&lt;br&gt;&lt;a href=&quot;mailto:atomo_studio@naver.com&quot;&gt;문의: atomo_studio@naver.com&lt;/a&gt;&lt;/p&gt;&lt;p&gt;외부 글꼴 제공: jsDelivr · &lt;a href=&quot;privacy.html&quot;&gt;개인정보처리방침&lt;/a&gt;&lt;/p&gt;&lt;/footer&gt;&lt;/main&gt;
&lt;script&gt;
/* 순수 계산: 시간은 소수 둘째 자리까지, 시급은 원 단위 */
(function(root){
function calculate(v){
 const errors={};const n={};
 for(const key of ['wage','hours','average']){
  const s=String(v[key]??'').trim();
  if(!/^\d+(?:\.\d{1,2})?$/.test(s)){errors[key]='숫자를 입력하세요. 시간은 소수 둘째 자리까지 가능합니다.';continue;}
  n[key]=Number(s);
  if(!Number.isFinite(n[key]) || (key==='wage' ? n[key]&lt;=0 || n[key]&gt;1000000 || !Number.isInteger(n[key]) : n[key]&lt;0 || n[key]&gt;40)) errors[key]=key==='wage'?'시급은 1~1,000,000원의 정수로 입력하세요.':'시간은 0~40 사이로 입력하세요. 40시간 초과는 지원 범위 밖입니다.';
 }
