&lt;section class=&quot;guide&quot;&gt;&lt;h2&gt;계약 확인부터 결과 보관까지&lt;/h2&gt;&lt;div class=&quot;steps&quot;&gt;&lt;article class=&quot;step&quot;&gt;&lt;p class=&quot;no&quot;&gt;01&lt;/p&gt;&lt;h3&gt;약속한 시간 확인&lt;/h3&gt;&lt;p&gt;근로계약서의 시급과 소정근로시간을 확인하세요. 30분은 0.5시간으로 입력합니다.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;step&quot;&gt;&lt;p class=&quot;no&quot;&gt;02&lt;/p&gt;&lt;h3&gt;평균·개근 확인&lt;/h3&gt;&lt;p&gt;평균 주 15시간 이상인지, 정해진 근로일에 모두 출근했는지 확인하세요.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;step&quot;&gt;&lt;p class=&quot;no&quot;&gt;03&lt;/p&gt;&lt;h3&gt;매주 다시 비교&lt;/h3&gt;&lt;p&gt;예상액과 급여명세서를 비교하세요. 이 페이지를 북마크하면 급여 확인일에 다시 쓰기 편합니다.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;tip&quot;&gt;&lt;strong&gt;팁 · 표준 사례로 먼저 확인하세요&lt;/strong&gt;&lt;p&gt;시급 10,320원, 매주 20시간, 개근이면 주휴시간 4시간, 주휴수당 41,280원, 주휴 포함 주급 247,680원입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;warning&quot;&gt;&lt;strong&gt;주의 · 예상액과 실제 지급액은 다를 수 있어요&lt;/strong&gt;&lt;p&gt;결근이면 이 도구는 주휴수당만 0원으로 안내합니다. 실제 일한 시간을 받지 않으므로 결근 주의 주급은 계산하지 않습니다. 출근으로 인정되는 휴가 등 개근 판단이 애매하면 ‘모름’을 선택하세요. 계약·취업규칙에 따른 추가 지급이나 예외는 고용노동부 1350에 확인하세요.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;guide&quot;&gt;&lt;h2&gt;계산 기준과 자주 묻는 질문&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;평균 14.99시간과 15시간은 어떻게 다른가요?&lt;/summary&gt;&lt;p&gt;4주 평균 주 소정근로시간이 15시간 미만이면 법정 주휴 적용 대상에서 제외됩니다. 15시간은 포함되며 개근 등 다른 조건도 확인해야 합니다. 평균은 경계 판단 전에 반올림하지 않습니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;주휴시간은 어떻게 구하나요?&lt;/summary&gt;&lt;p&gt;고정 일정·통상 주 5일 40시간 기준에서는 주 소정근로시간 ÷ 40 × 8입니다. 주휴수당은 그 시간 × 시급, 기본 주급은 소정근로시간 × 시급입니다. 일정이 달라 평균과 이번 주 시간이 다르면 이 도구는 단순 산식을 적용하지 않습니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;다음 주에도 일해야 하나요?&lt;/summary&gt;&lt;p&gt;다음 주 근무를 일률적인 필수 조건으로 추가하지 않습니다. 다만 퇴사 주의 근로관계·주휴일 판단은 별도 확인이 필요하므로 이 도구의 지원 범위에서 제외합니다.&lt;/p&gt;&lt;/details&gt;
&lt;p class=&quot;small&quot; style=&quot;margin-top:24px&quot;&gt;&lt;strong&gt;적용: 2026년 · 공식 자료 확인일: 2026-10-16&lt;/strong&gt;&lt;br&gt;2027 최저시급은 이 버전에 반영하지 않았습니다. 시급 직접 입력은 가정 계산이며 적용연도 법령 갱신을 대신하지 않습니다.&lt;/p&gt;&lt;ul class=&quot;small&quot;&gt;&lt;li&gt;&lt;a href=&quot;https://moel.go.kr/mainpop2.do&quot;&gt;고용노동부: 주휴수당 산식·2026년 최저임금&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;https://www.law.go.kr/법령/근로기준법/제18조&quot;&gt;근로기준법 제18조: 4주 평균 주 15시간 기준&lt;/a&gt; · &lt;a href=&quot;https://www.law.go.kr/법령/근로기준법/제55조&quot;&gt;제55조: 유급휴일&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;https://www.law.go.kr/법령/근로기준법시행령/제30조&quot;&gt;시행령 제30조: 개근&lt;/a&gt; · &lt;a href=&quot;https://www.law.go.kr/법령/근로기준법시행령/제9조&quot;&gt;제9조·별표2: 단시간근로자 기준&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;https://1350.moel.go.kr/rtmview.do?id=1000324737&quot;&gt;고용노동부 상담: 통상근로자 근로일수에 따른 산정례&lt;/a&gt; · &lt;a href=&quot;https://1350.moel.go.kr/rtmview.do?id=1000305360&quot;&gt;평균 15시간 미만 적용 안내&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
&lt;footer&gt;&lt;strong&gt;다음 일정도 가볍게 준비하세요&lt;/strong&gt;&lt;p&gt;&lt;a href=&quot;https://leekyounglyul.github.io/gatsaeng/2027-leave/&quot;&gt;2027 연차 계산기 ↗&lt;/a&gt; · &lt;a href=&quot;https://leekyounglyul.github.io/gatsaeng/&quot;&gt;갓생 도구함 ↗&lt;/a&gt;&lt;/p&gt;&lt;p style=&quot;margin-top:16px&quot;&gt;갓생 연구소 · by Atomo Studio&lt;br&gt;무료 · 무광고 · 계정 없이 사용&lt;/p&gt;&lt;/footer&gt;&lt;/main&gt;
&lt;script&gt;
/* 순수 계산: 시간은 소수 둘째 자리까지, 시급은 원 단위 */
(function(root){
function calculate(v){
 const errors={};const n={};
 for(const key of ['wage','hours','average']){
  const s=String(v[key]??'').trim();
  if(!/^\d+(?:\.\d{1,2})?$/.test(s)){errors[key]='숫자를 입력하세요. 시간은 소수 둘째 자리까지 가능합니다.';continue;}
  n[key]=Number(s);
  if(!Number.isFinite(n[key]) || (key==='wage' ? n[key]&lt;=0 || n[key]&gt;1000000 || !Number.isInteger(n[key]) : n[key]&lt;0 || n[key]&gt;40)) errors[key]=key==='wage'?'시급은 1~1,000,000원의 정수로 입력하세요.':'시간은 0~40 사이로 입력하세요. 40시간 초과는 지원 범위 밖입니다.';
 }
 if(Object.keys(errors).length)return {state:'invalid',errors,reason:'입력값을 고쳐 주세요. 이전 결과는 표시하지 않습니다.'};
 if(v.scope!=='yes')return {state:'unknown',reason:v.scope==='unknown' &amp;&amp; v.attendance==='unknown'?'개근 여부와 계산 범위, 두 항목을 모두 선택해 주세요. 확인 전에는 수당과 주급을 표시하지 않습니다.':'계산 범위 확인이 필요합니다. 범위 밖 근로조건은 일반 산식으로 확정하지 않습니다.'};
 if(n.hours!==n.average)return {state:'unknown',reason:'이번 주와 평균 시간이 다릅니다. 변동 일정은 4주 총 소정시간과 통상근로일수로 별도 확인해야 합니다.'};
 if(v.attendance!=='yes' &amp;&amp; v.attendance!=='no')return {state:'unknown',reason:'개근 여부를 확인해 주세요. 모르는 상태에서는 수당과 주급을 계산하지 않습니다.'};
 if(n.average&lt;15)return {state:'excluded',holiday:0,reason:'평균 주 15시간 미만으로 법정 주휴 적용 대상에서 제외됩니다. 별도 약정에 따른 지급은 확인하세요.'};
 if(v.attendance==='no')return {state:'absent',holiday:0,reason:'미개근 입력 기준 주휴수당은 0원입니다. 실제 근로시간이 없어 결근 주의 주급은 계산하지 않습니다.'};
 const holidayHours=n.hours/40*8;const holiday=holidayHours*n.wage;const base=n.hours*n.wage;
 return {state:'eligible',holidayHours,holiday,base,total:base+holiday,reason:'입력한 조건에 따른 예상액입니다. 실제 지급액은 근로계약과 급여명세서를 함께 확인하세요.'};
}
root.calculate=calculate;
})(typeof module==='object'?module.exports:window);

&lt;/script&gt;&lt;script&gt;
const $=id=&gt;document.getElementById(id);
const url='https://leekyounglyul.github.io/gatsaeng/weekly-holiday-pay/';
const money=n=&gt;Math.round(n).toLocaleString('ko-KR')+'원';
const keys=['wage','hours','average','attendance','scope'];
let current;
function values(){return Object.fromEntries(keys.map(k=&gt;[k,$(k).value]));}
function update(){
 const v=values();current=calculate(v);
 for(const k of keys.slice(0,3)){const e=current.errors?.[k]||'';$(k+'-error').textContent=e;$(k).setAttribute('aria-invalid',e?'true':'false');}
 $('status').textContent=({eligible:'예상 주휴수당',excluded:'법정 주휴 적용 제외',absent:'미개근 기준 주휴수당',invalid:'입력 확인 필요',unknown:'조건 확인 필요'})[current.state];
 $('holiday').textContent=current.holiday===undefined?'—':money(current.holiday);
 $('reason').textContent=current.reason+(Number(v.wage)&gt;0 &amp;&amp; Number(v.wage)&lt;10320?' 입력 시급은 2026 최저시급보다 낮습니다. 최저임금 적용·감액 여부를 별도로 확인하세요.':'');
 $('numbers').hidden=current.state!=='eligible';
 if(current.state==='eligible'){
  $('holidayHours').textContent=Number(current.holidayHours.toFixed(6))+'시간';
  for(const k of ['base','total'])$(k).textContent=money(current[k]);
  $('formula').textContent=`주휴시간: ${v.hours} ÷ 40 × 8 = ${Number(current.holidayHours.toFixed(6))}시간 / 주휴수당: 주휴시간 × ${v.wage}원 / 기본 주급: ${v.hours} × ${v.wage}원 / 합계: 기본 주급 + 주휴수당`;
 }
 $('manual').hidden=true;$('notice').textContent='';
}
function resultText(){const v=values();return `갓생 연구소 주휴수당 계산
시급 ${v.wage}원 / 주 소정 ${v.hours}시간 / 4주 평균 주 ${v.average}시간
개근: ${$('attendance').selectedOptions[0].textContent}
범위: ${$('scope').selectedOptions[0].textContent}
${$('status').textContent}: ${current.holiday===undefined?'금액 미표시':money(current.holiday)}
${$('reason').textContent}`+(current.state==='eligible'?`
유급 주휴 ${Number(current.holidayHours.toFixed(6))}시간 / 기본 주급 ${money(current.base)} / 주휴 포함 ${money(current.total)} (세전·가산 제외·원 단위 반올림)`:'')+`
2026 적용 · 2026-10-16 확인
${url}`;}
async function copy(text){try{await navigator.clipboard.writeText(text);$('notice').textContent='복사했습니다.';}catch(e){$('manual').hidden=false;$('copytext').value=text;$('copytext').focus();$('copytext').select();$('notice').textContent='자동 복사가 지원되지 않습니다. 아래 내용을 직접 복사하세요.';}}
$('form').addEventListener('submit',e=&gt;{e.preventDefault();update();if(current.state==='invalid'){const first=Object.keys(current.errors)[0];$(first).focus();}});
keys.forEach(k=&gt;$(k).addEventListener('input',update));
$('copy').onclick=()=&gt;copy(resultText());$('link').onclick=()=&gt;copy(url);
$('share').onclick=async()=&gt;{const text=resultText();if(!navigator.share){await copy(text);return;}try{await navigator.share({title:'주휴수당·주급 계산기',text});$('notice').textContent='공유 화면을 열었습니다.';}catch(e){if(e.name==='AbortError'){$('notice').textContent='공유를 취소했습니다. 결과 복사를 이용할 수 있어요.';}else{await copy(text);}}};
update();
