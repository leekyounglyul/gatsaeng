<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="render-size" content="1080x1350"><meta name="robots" content="noindex,nofollow"><title>오늘 시장 한 장 · 가상 시안</title><style>*{box-sizing:border-box}body{margin:0;background:#1a1a1a;color:#f6f6f3;font:30px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums}.card{width:1080px;min-height:1350px;padding:72px 64px;display:flex;flex-direction:column}.date{font-size:32px;border-bottom:2px solid #666;padding-bottom:24px}.demo{float:right;color:#bbb;font-size:25px}h1{font-size:75px;letter-spacing:-4px;line-height:1.2;margin:52px 0 60px}.up{color:#00cc4b}.down{color:#ff4433}.label{font-size:25px;color:#aaa}.row{display:flex;justify-content:space-between;gap:24px;border-top:2px solid #484848;padding:30px 0;font-size:48px;font-weight:700}.source{margin-top:auto;padding-top:40px;border-top:2px solid #666;color:#bbb;font-size:27px}.source strong{color:white;display:block;margin-bottom:8px}#state{color:#ffcf76}@media(max-width:600px){.card{width:100%;min-height:100svh;padding:28px 24px}.date{font-size:16px}.demo{font-size:12px}h1{font-size:clamp(26px,7.8vw,42px);letter-spacing:-1.5px;margin:32px 0}.label{font-size:13px}.row{font-size:clamp(19px,6vw,30px);padding:22px 0;gap:8px}.source{font-size:14px;padding-top:25px}}</style></head><body><main class="card"><div class="date">2026.10.20 아침 <span class="demo">가상 시안 · 실제 시세 아님</span></div><h1 id="summary"><span class="up">반도체 ↑ +4.20%</span><br><span class="down">2차전지 ↓ −3.10%</span></h1><div class="label">크게 움직인 테마 · 가상 5개 중</div><section id="rows"><div class="row"><span>01 반도체</span><span class="up">↑ +4.20%</span></div><div class="row"><span>02 2차전지</span><span class="down">↓ −3.10%</span></div><div class="row"><span>03 로봇</span><span class="up">↑ +2.40%</span></div></section><div class="source"><strong id="state">데이터 미연결 · 가상 예시</strong>예시 기준 10/19 15:30 · 출처: 가상 데이터<br>구성 종목 등락률 단순평균 · 투자 추천 아님</div></main><script>const state=new URLSearchParams(location.search).get('state');if(state==='delayed')document.querySelector('#state').textContent='갱신 지연 · ガ상 예시 / 최신 시세 아님'.replace('ガ','가');if(state==='missing'){document.querySelector('#summary').textContent='데이터 없음';document.querySelector('#rows').textContent='수치와 순위를 표시하지 않아요.';document.querySelector('#state').textContent='데이터 없음 · 가상 시안';}</script></body></html>
